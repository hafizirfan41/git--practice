<!DOCTYPE html>
<html>

<head>
    <title>Git Practice</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
            box-sizing: border-box;
        }

        body {}

        .conatiner {}

        .navbar {
            height: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: black;
        }

        ul {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;

        }

        li {
            color: white;
            list-style: none;

            font-size: 13px;
            font-weight: 600;
        }

        h2 {
            color: white;
            font-size: 13px;
            border: solid 1px white;
            padding: 12px;
            border-radius: 4px;
            /* background: white; */
        }

        button {
            color: white;
            font-size: 13px;
            border: solid 1px white;
            padding: 12px;
            border-radius: 4px;
            background: none;
        }
        li:hover {
            background-color: white;
            color: black;
            padding: 12px;
            border-radius: 8px;
        }
        button:hover {
               background-color: white;
            color: black;
            /* padding: 12px; */
            /* border-radius: 8px; */
        }

        h2:hover {
              background-color: white;
            color: black;
        }
    </style>
</head>

<body>
    <div class="conatiner">
        <div class="navbar">
            <div class="logo">
                <h2>Website</h2>
            </div>
            <ul>
                <li>Home</li>
                <li>Contact</li>
                <li>Services</li>
                <li>About</li>
            </ul>
            <button>Sign in</button>
        </div>

        <h1>
            Learning - git & GitHub
        </h1>
        <p>
            My road map for frontend dev
        </p>
    </div>
</body>

</html>
